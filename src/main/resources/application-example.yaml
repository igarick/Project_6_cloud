spring:
  application:
    name: pet - 6

  datasource:
    url: jdbc:postgresql://localhost:5433/${your_database_name}
    username: ${your_database_user}
    password: ${your_database_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

  liquibase:
    enabled: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
      enabled: true

  data:
    redis:
      host: localhost
      port: 6379

minio:
  endpoint: http://localhost:9000
  access-key: ${your_minio_user}
  secret-key: ${your_minio_password}
  bucket: user-files
